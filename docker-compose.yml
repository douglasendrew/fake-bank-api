services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake_bank_app
    restart: always
    ports:
      - "9501:9501"
    environment:
      - APP_NAME=FakeBank
      - APP_ENV=local
      - DB_DRIVER=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=fake_bank
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=FakeBankSuperSecretJwtKey2026!#
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=fake_bank_group
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - fakebank_net

  postgres:
    image: postgres:16-alpine
    container_name: fake_bank_postgres
    restart: always
    environment:
      POSTGRES_DB: fake_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fakebank_net

  redis:
    image: redis:7-alpine
    container_name: fake_bank_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - fakebank_net

  kafka:
    image: apache/kafka:latest
    container_name: fake_bank_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fakebank_net

networks:
  fakebank_net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
